name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multitenant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d multitenant"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Migrate database
        env:
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/multitenant
        run: npm run db:migrate

      - name: End-to-end tests
        env:
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/multitenant
          REDIS_URL: redis://localhost:6379
        run: npm run test:e2e